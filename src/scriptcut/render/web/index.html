<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>ScriptCut 预览</title>
  <style>
    html, body { margin: 0; background: #111; color: #ccc; font: 13px/1.4 system-ui, sans-serif; }
    #stage { display: block; max-width: 100vw; max-height: 100vh; margin: 0 auto; }
    #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 10px; background: rgba(0,0,0,.6); display: none; }
    body.interactive #bar { display: flex; gap: 8px; align-items: center; }
    #bar input[type=range] { flex: 1; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="bar"><button id="play">▶</button><input id="seek" type="range" min="0" max="1" step="0.001" value="0" /><span id="time">0.00</span></div>
  <script type="module" src="/__engine__/engine.js"></script>
</body>
</html>
